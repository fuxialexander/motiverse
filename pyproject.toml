[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motiverse"
version = "0.1.0"
description = "Scalable genome motif co-occurrence and peak-group profiling"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Xi Fu", email = "fuxialexander@gmail.com" }]
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "numcodecs>=0.15",
  "pandas>=2.0",
  "torch>=2.0",
  "tqdm>=4.66",
  "zarr>=3.0",
]

[project.optional-dependencies]
motifs = [
  "gcell @ git+https://github.com/fuxialexander/gcell@main",
]
plots = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
caesarion = [
  "caesar @ git+https://github.com/fuxialexander/Caesarion@main",
]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.scripts]
motiverse = "motiverse.main:main"

[project.urls]
Homepage = "https://github.com/fuxialexander/motiverse"
Repository = "https://github.com/fuxialexander/motiverse"
Issues = "https://github.com/fuxialexander/motiverse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motiverse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: exercises Zarr IO or multi-module workflows",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
